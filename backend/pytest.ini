[pytest]
# Où sont les tests
testpaths = tests

# Options par défaut :
#   -v          : verbeux (affiche chaque test)
#   -ra         : affiche un résumé des tests non-passés
#   --strict-markers : refuse les markers non déclarés (évite les typos)
addopts = -v -ra --strict-markers

# Markers personnalisés (pour filtrer : pytest -m integration)
markers =
    integration: tests qui touchent une vraie base PostgreSQL
    unit: tests unitaires purs (sans DB)

# Nom des fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::DeprecationWarning:starlette.*
